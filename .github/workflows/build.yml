name: build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build dinput8.dll (x86)
        shell: cmd
        run: |
          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
          for /f "usebackq tokens=*" %%i in (`"%VSWHERE%" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSPATH=%%i"
          call "%VSPATH%\VC\Auxiliary\Build\vcvars32.bat"
          cd src
          if not exist obj mkdir obj
          cl /nologo /O2 /MT /EHsc /W3 /D_CRT_SECURE_NO_WARNINGS /Fo:obj\ /Fd:obj\dinput8_fix.pdb dinput8_fix.cpp ^
             /link /DLL /DEF:dinput8.def /OUT:..\files\dinput8.dll /MACHINE:X86 ^
             dxguid.lib user32.lib kernel32.lib

      - name: SHA256
        shell: cmd
        run: certutil -hashfile files\dinput8.dll SHA256

      - uses: actions/upload-artifact@v4
        with:
          name: dinput8-x86
          path: files/dinput8.dll
